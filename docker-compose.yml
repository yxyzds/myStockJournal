services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mystockjournal
      POSTGRES_PASSWORD: mystockjournal
      POSTGRES_DB: mystockjournal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mystockjournal -d mystockjournal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
